services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-builder
    ports:
      - "18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_TRUSTED_PROXIES=192.168.100.0/24,127.0.0.1
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - TZ=Europe/Moscow   
    networks:
      app_net:
        ipv4_address: 192.168.100.10
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "18790:18790"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openclaw
    networks:
      app_net:
        ipv4_address: 192.168.100.20
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

volumes:
  openclaw_data:
    name: openclaw-lab_openclaw_data
    external: true
